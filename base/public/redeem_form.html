<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar código</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0b0b0b; font-family: Arial, sans-serif; color:#fff;
    }
    .box{
      width:min(640px, 92vw); background:#141414; border:1px solid #2a2a2a;
      border-radius:18px; padding:22px; box-sizing:border-box;
    }
    h1{ margin:0 0 10px 0; font-size:24px; font-weight:700; }
    p{ margin:0 0 18px 0; color:#bdbdbd; font-size:16px; line-height:1.3; }

    .pin-row{ display:flex; gap:14px; justify-content:center; align-items:center; margin:18px 0 6px 0; }
    .pin-box{
      width:80px; height:74px; border-radius:14px; border:2px solid #303030; background:#0f0f0f;
      display:flex; align-items:center; justify-content:center; position:relative; outline:none;
    }
    .pin-box::after{
      content:""; position:absolute; left:16px; right:16px; bottom:14px;
      height:4px; border-radius:999px; background:#2f2f2f;
    }
    .pin-digit{ font-size:34px; font-weight:800; transform: translateY(-4px); }

    .pin-box.focused{ border-color:#1f6feb; box-shadow: 0 0 0 4px rgba(31,111,235,.25); }
    .pin-box.focused::after{ background:#1f6feb; }

    .msg{ margin-top:14px; min-height:22px; text-align:center; font-size:16px; color:#ff6b6b; }
    .hidden-input{ position:absolute; opacity:0; pointer-events:none; width:1px;height:1px; }
  </style>
</head>
<body>
  <div class="box" id="box" tabindex="0">
    <h1>Ingresá tu código</h1>
    <p>Escribí los 4 números con el control remoto. Se enviará automáticamente al completar.</p>

    <input class="hidden-input" id="realInput" inputmode="numeric" autocomplete="one-time-code" />
    <div class="pin-row" id="pinRow" aria-label="Código de 4 dígitos">
      <div class="pin-box" data-idx="0"><div class="pin-digit" id="d0"></div></div>
      <div class="pin-box" data-idx="1"><div class="pin-digit" id="d1"></div></div>
      <div class="pin-box" data-idx="2"><div class="pin-digit" id="d2"></div></div>
      <div class="pin-box" data-idx="3"><div class="pin-digit" id="d3"></div></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="./redeem.js" defer></script>
</body>
</html>
