<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar código</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#0b0b0b;
      font-family: Arial, sans-serif;
      color:#fff;
    }
    .box{
      width:min(640px, 92vw);
      background:#141414;
      border:1px solid #2a2a2a;
      border-radius:18px;
      padding:22px;
      box-sizing:border-box;
    }
    h1{
      margin:0 0 10px 0;
      font-size:24px;
      font-weight:700;
    }
    p{
      margin:0 0 18px 0;
      color:#bdbdbd;
      font-size:16px;
      line-height:1.3;
    }
    .pin-row{
      display:flex;
      gap:14px;
      justify-content:center;
      align-items:center;
      margin:18px 0 6px 0;
    }
    .pin-box{
      width:80px;
      height:74px;
      border-radius:14px;
      border:2px solid #303030;
      background:#0f0f0f;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      outline:none;
    }
    .pin-box::after{
      content:"";
      position:absolute;
      left:16px;
      right:16px;
      bottom:14px;
      height:4px;
      border-radius:999px;
      background:#2f2f2f;
    }
    .pin-digit{
      font-size:34px;
      font-weight:800;
      transform: translateY(-4px);
    }
    .pin-box.focused{
      border-color:#1f6feb;
      box-shadow: 0 0 0 4px rgba(31,111,235,.25);
    }
    .pin-box.focused::after{
      background:#1f6feb;
    }
    .msg{
      margin-top:14px;
      min-height:22px;
      text-align:center;
      font-size:16px;
      color:#ff6b6b;
    }
    .hidden-input{
      position:absolute;
      opacity:0;
      pointer-events:none;
      width:1px;height:1px;
    }
  </style>
</head>
<body>
  <div class="box" id="box" tabindex="0">
    <h1>Ingresá tu código</h1>
    <p>Escribí los 4 números con el control remoto. Se enviará automáticamente al completar.</p>

    <input class="hidden-input" id="realInput" inputmode="numeric" autocomplete="one-time-code" />
    <div class="pin-row" id="pinRow" aria-label="Código de 4 dígitos">
      <div class="pin-box" data-idx="0"><div class="pin-digit" id="d0"></div></div>
      <div class="pin-box" data-idx="1"><div class="pin-digit" id="d1"></div></div>
      <div class="pin-box" data-idx="2"><div class="pin-digit" id="d2"></div></div>
      <div class="pin-box" data-idx="3"><div class="pin-digit" id="d3"></div></div>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const LEN = 4;

    const box = document.getElementById('box');
    const realInput = document.getElementById('realInput');
    const msg = document.getElementById('msg');

    let digits = ["", "", "", ""];
    let cursor = 0;
    let submitting = false;

    function render() {
      for (let i = 0; i < LEN; i++) {
        document.getElementById('d' + i).textContent = digits[i];
        const el = document.querySelector(\`.pin-box[data-idx="\${i}"]\`);
        el.classList.toggle('focused', i === cursor);
      }
    }

    function setMessage(text) { msg.textContent = text || ""; }

    function focusCapture() {
      realInput.focus({ preventScroll: true });
      box.focus({ preventScroll: true });
    }

    function addDigit(n) {
      if (submitting) return;
      if (cursor >= LEN) return;
      digits[cursor] = String(n);
      cursor = Math.min(LEN, cursor + 1);
      render();
      if (digits.join("").length === LEN) validateAndGo();
    }

    function backspaceLike() {
      if (submitting) return;
      if (cursor > 0 && digits[cursor] === "") cursor--;
      if (digits[cursor] !== "") digits[cursor] = "";
      else if (cursor > 0) { cursor--; digits[cursor] = ""; }
      render();
    }

    function moveLeftAndDelete() {
      if (submitting) return;
      if (cursor > 0) { cursor--; digits[cursor] = ""; }
      else { digits[0] = ""; }
      render();
    }

    async function validateAndGo() {
      if (submitting) return;
      const code = digits.join("");
      if (!/^\d{4}$/.test(code)) return;

      submitting = true;
      setMessage("");

      try {
        const r = await fetch("/api/redeem", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ code })
        });
        const j = await r.json().catch(()=> ({}));

        if (!r.ok) {
          setMessage(j.error || "Código inválido");
          submitting = false;
          digits = ["","","",""]; cursor = 0; render(); focusCapture();
          return;
        }

        window.location.href = j.redirect;
      } catch (e) {
        setMessage("Error de conexión");
        submitting = false;
      }
    }

    box.addEventListener('keydown', (e) => {
      if (e.key >= "0" && e.key <= "9") { e.preventDefault(); addDigit(e.key); return; }
      if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); backspaceLike(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); moveLeftAndDelete(); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); cursor = Math.min(LEN - 1, cursor + 1); render(); return; }
      if (e.key === "Enter") { e.preventDefault(); if (digits.join("").length === LEN) validateAndGo(); return; }
    });

    realInput.addEventListener('input', () => {
      if (submitting) return;
      const v = (realInput.value || "").replace(/\D/g, "").slice(0, LEN);
      for (let i=0;i<LEN;i++) digits[i] = v[i] || "";
      cursor = Math.min(LEN - 1, v.length);
      render();
      if (v.length === LEN) validateAndGo();
    });

    document.getElementById('pinRow').addEventListener('click', (e) => {
      const boxEl = e.target.closest('.pin-box');
      if (!boxEl) return;
      cursor = Number(boxEl.dataset.idx || 0);
      render();
      focusCapture();
    });

    window.addEventListener('load', () => { cursor = 0; render(); focusCapture(); });
  </script>
</body>
</html>
