<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar código</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#0b0b0b; font-family: Arial, sans-serif; color:#fff;
    }
    .box{
      width:min(640px, 92vw); background:#141414; border:1px solid #2a2a2a;
      border-radius:18px; padding:22px; box-sizing:border-box;
      outline:none;
    }
    h1{ margin:0 0 10px 0; font-size:24px; font-weight:700; }
    p{ margin:0 0 18px 0; color:#bdbdbd; font-size:16px; line-height:1.3; }

    .pin-wrap{
      position:relative;
      display:flex; justify-content:center;
      margin:18px 0 6px 0;
    }
    .pin-row{ display:flex; gap:14px; justify-content:center; align-items:center; }

    .pin-box{
      width:80px; height:74px; border-radius:14px; border:2px solid #303030; background:#0f0f0f;
      display:flex; align-items:center; justify-content:center; position:relative;
    }
    .pin-box::after{
      content:""; position:absolute; left:16px; right:16px; bottom:14px;
      height:4px; border-radius:999px; background:#2f2f2f;
    }
    .pin-digit{ font-size:34px; font-weight:800; transform: translateY(-4px); }

    /* Estado foco (cuando el input está enfocado) */
    .pin-wrap.focused .pin-box{
      border-color:#1f6feb;
      box-shadow: 0 0 0 4px rgba(31,111,235,.25);
    }
    .pin-wrap.focused .pin-box::after{ background:#1f6feb; }

    .msg{ margin-top:14px; min-height:22px; text-align:center; font-size:16px; color:#ff6b6b; }

    /*
      ✅ El input REAL (clave para teclado nativo):
      - Está EN la misma zona (no fuera de pantalla)
      - Es "casi" transparente, pero NO 0 (algunos launchers ignoran opacity:0)
      - Recibe foco con OK/Enter/click
    */
    .real-input{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      outline:none;
      background:transparent;

      opacity:0.01;            /* NO 0 */
      color:transparent;        /* que no se vea el texto */
      caret-color:transparent;  /* que no se vea el cursor */
    }

    /* Para que el contenedor sea navegable con control remoto */
    .pin-wrap{ border-radius:18px; }
    .pin-wrap:focus-within { outline:none; }

    /* Tip: si tu launcher necesita “ver” el input, podés subir a 0.08 */
    /* .real-input{ opacity:0.08; } */
  </style>
</head>
<body>
  <div class="box" id="box" tabindex="0">
    <h1>Ingresá tu código</h1>
    <p>Presioná OK/Enter para abrir el teclado del TV Box y escribí los 4 números. Se enviará automáticamente al completar.</p>

    <div class="pin-wrap" id="pinWrap">
      <div class="pin-row" aria-label="Código de 4 dígitos">
        <div class="pin-box"><div class="pin-digit" id="d0"></div></div>
        <div class="pin-box"><div class="pin-digit" id="d1"></div></div>
        <div class="pin-box"><div class="pin-digit" id="d2"></div></div>
        <div class="pin-box"><div class="pin-digit" id="d3"></div></div>
      </div>

      <!-- ✅ INPUT REAL: esto es lo que hace que Android TV muestre su teclado -->
      <input
        id="realInput"
        class="real-input"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="one-time-code"
        aria-label="Código de 4 dígitos"
      />
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script src="./redeem.js" defer></script>
</body>
</html>
