<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel KLUTYN</title>
  <style>
    body{font-family:Arial;background:#0b0b0b;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
    .box{width:min(720px,92vw);background:#141414;border:1px solid #2a2a2a;border-radius:18px;padding:18px}
    input,button{padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff}
    button{background:#1f6feb;border:0;font-weight:800;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .code{font-size:52px;font-weight:900;letter-spacing:10px;text-align:center;margin:18px 0}
    .muted{color:#bdbdbd}
    .err{color:#ff6b6b}
  </style>
</head>
<body>
  <div class="box">
    <h2>Panel (ver código actual)</h2>

    <div class="row">
      <input id="pass" placeholder="Contraseña panel" type="password" style="flex:1;min-width:220px">
      <button id="btn">Entrar</button>
    </div>

    <div id="msg" class="muted" style="margin-top:10px"></div>

    <div id="screen" style="display:none">
      <div class="code" id="code">----</div>
      <div class="muted">Se actualiza solo cuando alguien canjea correctamente.</div>
      <div class="muted" style="margin-top:6px">Última actualización: <span id="upd">-</span></div>
      <div class="row" style="margin-top:14px">
        <button id="refresh">Actualizar</button>
      </div>
    </div>
  </div>

  <script src="./panel.js" defer></script>
</body>
</html>
